const LANG_READY = { pt:true, en:false }; // EN do conteúdo dos cases ainda não existe
let lang = 'pt';
const t = (k) => (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : I18N.pt[k];

// ── Ícones do desktop ───────────────────────────────────────────────────────

  { id:'intel',    emoji:'🧠', key:'ic_intel' },
  { id:'sobre',    emoji:'👤', key:'ic_sobre' },
  { id:'palavras', emoji:'🗂️', key:'ic_palavras' },
  { id:'contato',  emoji:'📧', key:'ic_contato' },

// ── Registro de janelas ─────────────────────────────────────────────────────
const WIN = {

  expresso:    { title:'🏦 Bradesco_Expresso — Visão Geral', w:920, h:620, src:'case-expresso.html' },
  prospeccao:  { title:'📁 Prospecção_PCO — Design Sistêmico', w:880, h:620, src:'case-pco.html' },
  treinamentos:{ title:'🎓 Treinamentos — Logic over Logistics', w:840, h:620, src:'case-treino.html' },
  safer:       { title:'🔐 DW_Safer — Case Study', w:900, h:620, src:'case-safer.html' },
  designops:   { title:'📁 Design_Ops — Case Study', w:840, h:620, src:'case-designops.html' },
  intel:       { title:'🧠 Sistema_de_Inteligência — Case Study', w:840, h:620, src:'case-intel.html' },
  sobre:       { title:'👤 Sobre_Mim — Ficha de Personagem', w:780, h:620, src:'case-sobre.html' },
  palavras:    { title:()=>t('kw_title'), w:720, h:580, kind:'palavras' },
  contato:     { title:'💬 Bate-papo (L)Uol', w:460, h:500, kind:'contato' },
  lixeira:     { title:()=>t('trash_title'), w:480, h:430, kind:'lixeira' },

// Projetos (capas)
const PROJECTS = [
  { open:'expresso',    name:'Bradesco_Expresso',     thumb:'assets/tumb-expresso.jpeg',     invite:'Design para 41 mil pontos onde o sistema bancário não chega.', badge:'🏆 Innovation in Digital Banking 2024' },
  { open:'prospeccao',  name:'Prospecção_PCO',        thumb:'assets/tumb-pco.png',           invite:'Suposições furadas, uma conversa com quem usa, e um playbook de digitalização.', badge:'🔍 Discovery de campo' },
  { open:'safer',       name:'DW_Safer',              thumb:'assets/tumb-safer.png',         invite:'Resgatar um produto em movimento sem parar o piloto.', badge:'3 frentes reconstruídas' },
  { open:'treinamentos',name:'Treinamentos',          thumb:'assets/tumb-treinamentos.jpeg', invite:'Quando o conteúdo é o produto.', badge:'💰 R$200K / ano' },
  { open:'designops',   name:'Design_Ops',            thumb:'assets/tumb-designops.jpeg',    invite:'A documentação que virou ponto de partida.', badge:'📁 Single Source of Truth' },
  { open:'intel',       name:'Sistema de Inteligência',thumb:'assets/tumb-sistema.jpeg',     invite:'Um mapa de serviço que cresceu demais e virou ferramenta.', badge:'🧠 Documentação viva' },
];

// Palavras-chave (grupos → tags que abrem cases)
const KW_GROUPS = [
  { title:'Ecossistemas B2B & Sistemas Complexos', tags:[['design de produto B2B','expresso'],['sistemas complexos','expresso'],['ambiente regulado (bancário)','expresso'],['back-office','expresso'],['pensamento sistêmico','prospeccao'],['jornadas transacionais','prospeccao'],['design para escala','prospeccao']] },
  { title:'Design Systems & Consistência', tags:[['design ops','designops'],['single source of truth','intel'],['documentação viva','intel'],['governança de consistência','designops'],['design tokens','designops'],['handoff','designops'],['visão comparativa de jornadas','designops']] },
  { title:'UX Writing & Content Design', tags:[['UX writing','treinamentos'],['linguagem simples','treinamentos'],['microcopy','treinamentos'],['taxonomia de status','prospeccao'],['error messaging','prospeccao'],['tom de voz','treinamentos'],['conteúdo como produto','treinamentos']] },
  { title:'Pesquisa & Discovery (qualitativa)', tags:[['discovery','intel'],['mapeamento de gaps','intel'],['service blueprint','intel'],['pesquisa como infraestrutura','intel'],['roteiro de pesquisa','intel'],['entrevista qualitativa','prospeccao']] },

  { title:'Estratégia & Negócio', tags:[['design a serviço do negócio','safer'],['redução de custo operacional','treinamentos'],['métricas de produto','intel'],['IA como par cognitivo','intel'],['decisão documentada','safer']] },

// Lixeira (easter egg)
const TRASH = [
  ['curriculo_2019_FINAL_v3.doc','Aquele com foto 3x4 e objetivo genérico.'],
  ['curriculo_2020_Final_final(3).pdf','Feito no Canva.'],
  ['Tabelas_pra_mobile.fig','Meu maior arrependimento profissional.'],
  ['Minha carreira no marketing','Eu tenho pesadelos até hoje.'],
  ['Prospecção_Visão prospector_Tablet','É isso que dá não envolver o usuário na conversa.'],
  ['portfolio_wix_antigo.zip','Ninguém precisa ver isso. Confie em mim.'],
];

// ── Cena: horário do dia + progresso até o destino ──────────────────────────
const sceneEl = document.getElementById('scene');
const CASE_IDS = ['expresso','prospeccao','treinamentos','safer','designops','intel'];
const visited = new Set();
let arrived = false;
function timeOfDay(){ const h=new Date().getHours();
  if(h>=5 && h<11) return 'manha';
  if(h>=11 && h<18) return 'tarde';
  if(h>=18 && h<23) return 'noite';
  return 'madrugada'; }
function applyScene(){
  sceneEl.setAttribute('data-tod', timeOfDay());
  sceneEl.setAttribute('data-prog', String(Math.min(visited.size, CASE_IDS.length)));
}
function markVisited(id){
  if(!CASE_IDS.includes(id) || visited.has(id)) return;
  visited.add(id); applyScene();
  if(visited.size===CASE_IDS.length && !arrived){ arrived=true;
    sceneEl.classList.add('scene--arrived');
    setMascot('Você passou por todos os cases — chegou ao destino. 🌅 Obrigada por dirigir até aqui comigo.');
  } else if(visited.size < CASE_IDS.length){
    setMascot('+' + visited.size + '/' + CASE_IDS.length + ' do caminho percorrido. Cada case te deixa mais perto do destino. 🚗💨');
  }
}

// ── Estado do window manager ────────────────────────────────────────────────
const open = {};        // id -> {el, taskEl, min, max}
let zTop = 10;
const desktop = document.getElementById('desktop');
const tasksEl = document.getElementById('tasks');

function titleOf(id){ const w = WIN[id]; return typeof w.title === 'function' ? w.title() : w.title; }

function openWindow(id){
  const def = WIN[id]; if(!def) return;
  markVisited(id);
  if(open[id]){ restore(id); focus(id); return; }
  const mobile = window.innerWidth <= 720;
  const w = Math.min(def.w, window.innerWidth - 24);
  const h = Math.min(def.h, window.innerHeight - 64);
  const left = mobile ? 0 : Math.max(12, Math.round((window.innerWidth - w)/2) + (Object.keys(open).length*24 % 120) - 60);
  const top  = mobile ? 0 : Math.max(12, Math.round((window.innerHeight - h - 40)/2) - 20 + (Object.keys(open).length*18 % 80));

  const el = document.createElement('div');
  el.className = 'win';
  el.style.width = w+'px'; el.style.height = h+'px'; el.style.left = left+'px'; el.style.top = top+'px';
  el.style.zIndex = (++zTop);
  el.innerHTML =
    '<div class="win__bar"><span class="win__title">'+titleOf(id)+'</span>'+
    '<span class="win__ctrls">'+
      '<span class="win__btn" data-act="min" title="Minimizar">_</span>'+
      '<span class="win__btn" data-act="max" title="Maximizar">□</span>'+
      '<span class="win__btn" data-act="close" title="Fechar">×</span>'+
    '</span></div>'+
    '<div class="win__body"></div>';
  desktop.appendChild(el);

  const body = el.querySelector('.win__body');
  if(def.src){ body.innerHTML = '<iframe src="'+def.src+'" title="'+titleOf(id)+'"></iframe>'; }
  else { body.appendChild(renderSpecial(id)); }

  // taskbar button
  const taskEl = document.createElement('button');
  taskEl.type='button'; taskEl.className='os-task os-task--active'; taskEl.textContent = titleOf(id);
  taskEl.addEventListener('click', ()=>{ if(open[id].min){ restore(id); focus(id);} else if(isTop(id)){ minimize(id);} else { focus(id);} });
  tasksEl.appendChild(taskEl);

  open[id] = { el, taskEl, min:false, max:false };

  // controls
  el.querySelector('[data-act=min]').addEventListener('click',(e)=>{e.stopPropagation();minimize(id);});
  el.querySelector('[data-act=max]').addEventListener('click',(e)=>{e.stopPropagation();toggleMax(id);});
  el.querySelector('[data-act=close]').addEventListener('click',(e)=>{e.stopPropagation();closeWindow(id);});
  el.addEventListener('mousedown',()=>focus(id));
  dragify(el.querySelector('.win__bar'), el, id);
  focus(id);
}

function renderSpecial(id){
  const wrap = document.createElement('div');
  if(id==='projetos'){
    wrap.innerHTML = '<div style="padding:var(--space-16) var(--space-24) 0"><div class="t-subtitulo" style="color:var(--text-heading)">'+t('proj_sub')+'</div></div>'+
      '<div class="projgrid">'+ PROJECTS.map(p=>
        '<div class="projcard" data-open="'+p.open+'">'+
          '<div class="projcard__thumb"><img src="'+p.thumb+'" alt="'+p.name+'"></div>'+
          '<div class="projcard__body"><div class="projcard__name">'+p.name+'</div>'+
          '<div class="projcard__invite">'+p.invite+'</div>'+
          '<span class="projcard__badge">'+p.badge+'</span></div>'+
        '</div>').join('') +'</div>';
    wrap.addEventListener('click',(e)=>{ const c=e.target.closest('[data-open]'); if(c) openWindow(c.getAttribute('data-open')); });
  } else if(id==='palavras'){
    wrap.innerHTML = '<div style="padding:var(--space-24)">'+ KW_GROUPS.map(g=>
      '<div style="margin-bottom:var(--space-24)"><div class="sec-title" style="margin-top:0">'+g.title+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:var(--space-8)">'+ g.tags.map(tg=>
        '<button type="button" class="tag tag--roxo" data-open="'+tg[1]+'" style="cursor:pointer;border:1px solid color-mix(in srgb,var(--accent-roxo) 35%,#fff)">'+tg[0]+'</button>').join('') +'</div></div>').join('') +
      '<div class="quote quote--rosa"><p class="p">'+t('kw_close')+'</p></div></div>';
    wrap.addEventListener('click',(e)=>{ const c=e.target.closest('[data-open]'); if(c) openWindow(c.getAttribute('data-open')); });
  } else if(id==='lixeira'){
    wrap.innerHTML = '<div style="padding:var(--space-24)">'+ TRASH.map(it=>
      '<div style="display:flex;gap:var(--space-12);align-items:flex-start;padding:var(--space-8) 0;border-bottom:1px dashed var(--border-dashed)">'+
      '<span style="font-size:22px">🗎</span><div><div class="m-destaque" style="color:var(--text-heading)">'+it[0]+'</div>'+
      '<div class="m-pequeno" style="color:var(--text-muted);font-style:italic">'+it[1]+'</div></div></div>').join('') +'</div>';
  } else if(id==='contato'){
    wrap.appendChild(renderChat());
  }
  return wrap;
}

// ── Contato: bate-papo (L)Uol ───────────────────────────────────────────────
function renderChat(){
  const box = document.createElement('div');
  box.style.cssText = 'display:flex;flex-direction:column;height:100%;font-family:var(--font-mono)';
  box.innerHTML =
    '<div style="background:var(--bg-callout);color:var(--text-on-dark);padding:var(--space-8) var(--space-12);display:flex;justify-content:space-between;align-items:center">'+
      '<b class="t-abas">'+t('chat_room')+'</b><span style="font-size:11px;color:#8fd9c4">'+t('chat_online')+'</span></div>'+
    '<div id="chatlog" style="flex:1;overflow:auto;padding:var(--space-12);display:flex;flex-direction:column;gap:var(--space-8);background:var(--bg-subtle)"></div>'+
    '<div style="display:flex;gap:var(--space-8);padding:var(--space-8);border-top:var(--border-1) solid var(--border-card)">'+
      '<input id="chatin" placeholder="'+t('chat_ph')+'" style="flex:1;font-family:var(--font-mono);font-size:14px;padding:var(--space-8);border:var(--border-1) solid var(--border-dashed)">'+
      '<button type="button" id="chatsend" class="w95">'+t('chat_send')+'</button></div>';
  const log = box.querySelector('#chatlog');
  const bubble = (who,txt)=>{ const d=document.createElement('div');
    const mine = who==='you';
    d.style.cssText='max-width:80%;padding:var(--space-8) var(--space-12);border-radius:10px;font-size:14px;'+(mine
      ? 'align-self:flex-end;background:var(--purple-500);color:#fff;border-bottom-right-radius:2px'
      : 'align-self:flex-start;background:#fff;border:1px solid var(--border-card);border-bottom-left-radius:2px');
    d.innerHTML=txt; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; };
  // greetings sequence
  setTimeout(()=>bubble('lua','oi! que bom te ver por aqui 👀👀'), 350);
  setTimeout(()=>bubble('lua','essa sala já foi mais movimentada em 2001, mas prometo que hoje o atendimento é melhor.'), 1300);
  const send=()=>{ const i=box.querySelector('#chatin'); const v=i.value.trim(); if(!v) return; bubble('you',v); i.value='';
    setTimeout(()=>bubble('lua','eba! era só o que eu queria ouvir. me acha aqui 👇<br>📧 <a href="mailto:lluanaooliveira@gmail.com" style="color:var(--accent-rosa)">lluanaooliveira@gmail.com</a><br>🔗 <a href="https://www.linkedin.com/in/lua-anaoliveira/" target="_blank" rel="noopener" style="color:var(--accent-rosa)">LinkedIn</a>'), 700); };
  box.querySelector('#chatsend').addEventListener('click',send);
  box.querySelector('#chatin').addEventListener('keydown',(e)=>{ if(e.key==='Enter') send(); });
  return box;
}

// ── Window ops ──────────────────────────────────────────────────────────────
function focus(id){ const o=open[id]; if(!o) return; o.el.style.zIndex=(++zTop);
  Object.keys(open).forEach(k=>open[k].taskEl.classList.toggle('os-task--active', k===id && !open[k].min)); }
function isTop(id){ const o=open[id]; if(!o) return false; return Object.keys(open).every(k=>k===id || +open[k].el.style.zIndex <= +o.el.style.zIndex); }
function minimize(id){ const o=open[id]; o.min=true; o.el.classList.add('win--min'); o.taskEl.classList.remove('os-task--active'); }
function restore(id){ const o=open[id]; o.min=false; o.el.classList.remove('win--min'); }
function toggleMax(id){ const o=open[id]; o.max=!o.max; o.el.classList.toggle('win--max',o.max); }
function closeWindow(id){ const o=open[id]; if(!o) return; o.el.remove(); o.taskEl.remove(); delete open[id]; }

// ── Drag ────────────────────────────────────────────────────────────────────
function dragify(handle, el, id){
  handle.addEventListener('mousedown',(e)=>{
    if(window.innerWidth<=720 || open[id].max) return;
    if(e.target.closest('.win__btn')) return;
    e.preventDefault(); focus(id);
    const r=el.getBoundingClientRect(); const ox=e.clientX-r.left, oy=e.clientY-r.top;
    const move=(ev)=>{ el.style.left=Math.max(0,Math.min(window.innerWidth-60, ev.clientX-ox))+'px';
      el.style.top=Math.max(0,Math.min(window.innerHeight-80, ev.clientY-oy))+'px'; };
    const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}

// ── Ícones do desktop ───────────────────────────────────────────────────────
function renderIcons(){
  const box=document.getElementById('deskicons'); box.innerHTML='';
  ICONS.forEach(ic=>{
    const d=document.createElement('div'); d.className='deskicon'; d.tabIndex=0;
    d.innerHTML='<span class="deskicon__img">'+ic.emoji+'</span><span class="deskicon__label">'+t(ic.key)+'</span>';
    let lastClick=0;
    d.addEventListener('click',()=>{ document.querySelectorAll('.deskicon').forEach(x=>x.classList.remove('deskicon--sel')); d.classList.add('deskicon--sel');
      const now=Date.now(); if(now-lastClick<400){ openWindow(ic.id); } lastClick=now; });
    d.addEventListener('dblclick',()=>openWindow(ic.id));
    box.appendChild(d);
  });
}

// ── Menu Iniciar ────────────────────────────────────────────────────────────
const startBtn=document.getElementById('startBtn'), startmenu=document.getElementById('startmenu');
function renderStart(){ startmenu.innerHTML = ICONS.map(ic=>
  '<div class="os-startmenu__item" data-open="'+ic.id+'"><span style="font-size:14px">'+ic.emoji+'</span> '+t(ic.key)+'</div>').join(''); }
startBtn.addEventListener('click',(e)=>{ e.stopPropagation(); const show=startmenu.hasAttribute('hidden');
  startmenu.toggleAttribute('hidden',!show); startBtn.classList.toggle('os-start--on',show); });
startmenu.addEventListener('click',(e)=>{ const it=e.target.closest('[data-open]'); if(it){ openWindow(it.getAttribute('data-open')); startmenu.setAttribute('hidden',''); startBtn.classList.remove('os-start--on'); } });
document.addEventListener('click',()=>{ startmenu.setAttribute('hidden',''); startBtn.classList.remove('os-start--on'); });

// ── Idioma ──────────────────────────────────────────────────────────────────
const langBtn=document.getElementById('langBtn');
langBtn.addEventListener('click',()=>{
  const next = lang==='pt' ? 'en' : 'pt';
  if(!LANG_READY[next]){ // conteúdo do idioma ainda não 100%: troca o chrome e avisa
    setMascot(I18N[next].langHint + ' — por enquanto o conteúdo dos cases fica em PT. 😉');
  }
  lang=next; langBtn.textContent = lang==='pt' ? 'PT-BR' : 'EN';
  applyI18n();
});
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.getAttribute('data-i18n')); });
  renderIcons(); renderStart();
  // atualiza títulos de janelas abertas e botões de taskbar
  Object.keys(open).forEach(id=>{ const titEl=open[id].el.querySelector('.win__title'); if(titEl) titEl.textContent=titleOf(id); open[id].taskEl.textContent=titleOf(id); });
}

// ── Mascote ─────────────────────────────────────────────────────────────────
function setMascot(msg){ document.getElementById('mascotMsg').innerHTML=msg; document.getElementById('mascotBubble').style.display=''; }
document.getElementById('mascotClose').addEventListener('click',()=>{ document.getElementById('mascotBubble').style.display='none'; });

// ── Relógio ─────────────────────────────────────────────────────────────────
